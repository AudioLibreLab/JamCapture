active_config: xr18_studio

audio:
    backend: pipewire
    sample_rate: 48000

globals:
    audio_player: vlc
    output:
        backingtracks_directory: ~/Audio/JamCapture/BackingTracks
        recordings_directory: ~/Audio/JamCapture/Recordings

definitions:
    channels:
        # --- Focusrite Scarlett 2i2 ---
        - id: 2i2_guitar
          name: guitar
          sources:
            - alsa_input.usb-Focusrite_Scarlett_2i2_USB_Y814JK8264026F-00.analog-stereo:capture_FR
          audiomode: mono
          type: input
          volume: 4
          delay: 0

        - id: 2i2_microphone
          name: microphone
          sources:
            - alsa_input.usb-Focusrite_Scarlett_2i2_USB_Y814JK8264026F-00.analog-stereo:capture_FL
          audiomode: mono
          type: input
          volume: 3
          delay: 0

        # --- Behringer XR18 — canaux individuels ---
        - id: xr18_1
          sources:
            - alsa_input.usb-BEHRINGER_XR18_production_03-00.pro-input-0:capture_AUX0
          audiomode: mono
          type: input
          volume: 4
          delay: 0

        - id: xr18_2
          sources:
            - alsa_input.usb-BEHRINGER_XR18_production_03-00.pro-input-0:capture_AUX1
          audiomode: mono
          type: input
          volume: 4
          delay: 0

        - id: xr18_3
          sources:
            - alsa_input.usb-BEHRINGER_XR18_production_03-00.pro-input-0:capture_AUX2
          audiomode: mono
          type: input
          volume: 4
          delay: 0

        - id: xr18_9
          sources:
            - alsa_input.usb-BEHRINGER_XR18_production_03-00.pro-input-0:capture_AUX8
          audiomode: mono
          type: input
          volume: 4
          delay: 0

        # --- Backing track depuis le PC (monitor numérique — zéro conversion D/A/D) ---

        # Google Chrome (YouTube, etc.) — nœud source PipeWire, synchronisé
        # automatiquement avec capture_AUX0. Même comportement que Scarlett + Chrome :
        # pas de problème de latence car les deux sont du côté "source" du graphe.
        #
        # À éviter : monitor_AUX0/1 (loopback XR18) car il est côté "sink" →
        # décalage d'un round-trip USB complet avec capture_AUX0.
        - id: chrome_stereo
          name: chrome
          sources:
            - Google Chrome:output_FL
            - Google Chrome:output_FR
          audiomode: stereo
          type: monitor
          volume: 0.8
          delay: 0

        # --- Carla (plugin host) ---
        - id: carla
          sources:
            - Carla-Patchbay:audio-out1
          audiomode: mono
          type: input
          volume: 4
          delay: 0

configs:
    # XR18 multi-piste + Chrome (backing track YouTube, synchronisé, sans latence)
    xr18_studio:
        auto_mix: true
        channels:
            - name: ch1
              ref: xr18_1
            - name: ch2
              ref: xr18_2
            - name: ch3
              ref: xr18_3
            - name: ch9
              ref: xr18_9
            - ref: chrome_stereo
        output:
            format: flac

    # XR18 seul (sans backing track)
    xr18_only:
        auto_mix: true
        channels:
            - name: ch1
              ref: xr18_1
            - name: ch2
              ref: xr18_2
            - name: ch3
              ref: xr18_3
            - name: ch9
              ref: xr18_9
        output:
            format: flac

    # Scarlett 2i2 + backing track Chrome
    scarlett_studio:
        auto_mix: true
        channels:
            - ref: 2i2_guitar
            - ref: 2i2_microphone
            - ref: chrome_stereo
              volume: 0.6
        output:
            format: flac

    # Guitare seule
    guitar_only:
        auto_mix: true
        channels:
            - ref: 2i2_guitar
              volume: 5
        output:
            format: wav

    # Carla
    carla:
        auto_mix: true
        channels:
            - ref: carla
              volume: 1.5
            - ref: chrome_stereo
        output:
            format: flac

supported_audio_extensions:
    - flac
    - wav
    - mp3
